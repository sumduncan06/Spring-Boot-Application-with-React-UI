name: Spring Boot /fib CI

on:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Spring Boot project
        run: |
          cd SpringBootProject
          ./gradlew clean build

      - name: Build Docker image
        run: |
          cd SpringBootProject
          docker build -t spring-backend-test .

      - name: Run Spring Boot container
        run: |
          docker run -d -p 8080:8080 --name spring-test spring-backend-test

      - name: Test /fib endpoint
        run: |
          for i in {1..30}; do
            result=$(curl -s http://localhost:8080/fib?length=10)
            if [[ "$result" == *0* ]]; then
              echo "✅ Fibonacci result: $result"
              exit 0
            fi
            echo "Waiting for Spring Boot..."
            sleep 1
          done
          echo "❌ Fibonacci test failed: /fib did not return expected result"
          exit 1

      - name: Stop container
        run: |
          docker stop spring-test
