name: Spring Boot /fib CI

on:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set up JDK 21 for Gradle build
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3️⃣ Build Spring Boot project with Gradle
      - name: Build Spring Boot project
        run: |
          cd SpringBootProject
          ./gradlew clean build

      # 4️⃣ Build Docker image for Spring Boot
      - name: Build Docker image
        run: |
          cd SpringBootProject
          docker build -t spring-backend-test .

      # 5️⃣ Run Docker container in background
      - name: Run Spring Boot container
        run: |
          docker run -d -p 8080:8080 --name spring-test spring-backend-test

      # 6️⃣ Wait for app to be ready and test /fib endpoint
      - name: Test /fib endpoint
        run: |
          for i in {1..60}; do
            result=$(curl -s http://localhost:8080/fib?length=10)
            # Check if response contains "0" to confirm Fibonacci
            if [[ "$result" == *0* ]]; then
              echo "✅ Fibonacci result: $result"
              exit 0
            fi
            echo "Waiting for Spring Boot..."
            sleep 1
          done
          echo "❌ Fibonacci test failed"
          echo "=== Spring Boot container logs ==="
          docker logs spring-test
          exit 1

      # 7️⃣ Stop the container to clean up
      - name: Stop container
        if: always()
        run: |
          docker stop spring-test
          docker rm spring-test
